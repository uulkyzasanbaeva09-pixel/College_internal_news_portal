<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Новостной портал "ИТ.Москва"</title>
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/notifications.css" />
    <link rel="stylesheet" href="style/responsive.css" />
  </head>
  <body>
    <aside class="sidebar">
      <img src="Фото/Лого.svg" alt="Логотип" />
      <h1 class="sidebar-h1"><span class="it">IT.</span>Москва</h1>

      <nav>
        <a class="nav-btn active" href="index.html">
          <img src="Фото/Дом.svg" alt="иконка главная" width="25" height="25" />
          Главная
        </a>

        <a class="nav-btn" href="favorites.html">
          <img
            src="Фото/Избранное.svg"
            alt="иконка избранное"
            width="30"
            height="30"
          />
          Избранное
        </a>

        <a class="nav-btn" href="news.html">
          <img
            src="Фото/новости.svg"
            alt="иконка новости"
            width="30"
            height="30"
          />
          Все новости
        </a>

        <a class="nav-btn" href="settings.html">
          <img
            src="Фото/настройки.svg"
            alt="иконка настройки"
            width="30"
            height="30"
          />
          Настройки
        </a>
      </nav>

      <button class="exit" type="button">
        <img src="Фото/Выход.svg" alt="иконка выход" width="34" height="34" />
        Выйти
      </button>
    </aside>
    <header class="notifications-header">
      <div class="mobile-brand">
        <img src="Фото/Лого.svg" alt="Логотип" />
        <span><span class="it">IT.</span>Москва</span>
      </div>

      <div class="mobile-header-actions">
        <a href="notifications.html">
          <img src="Фото/Уведомления.svg" alt="Уведомления" class="bell" />
        </a>

        <a href="settings.html">
          <img src="Фото/Профиль.svg" alt="Профиль" class="profile" />
        </a>

        <button
          class="mobile-menu-toggle"
          type="button"
          aria-label="Открыть меню"
          aria-expanded="false"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M3 6h18"></path>
            <path d="M3 12h18"></path>
            <path d="M3 18h18"></path>
          </svg>
        </button>
      </div>
    </header>
    <div class="mobile-menu-overlay"></div>
    <main>
      <h1>Уведомления</h1>
      <section class="notifications">
        <article
          class="notification"
          onclick="window.location.href = 'article3.html'"
        >
          <img src="Фото/Уведомления.svg" />
          <h2>Перенос пар: Лекция по этике ИИ</h2>
        </article>

        <article
          class="notification"
          onclick="window.location.href = 'article1.html'"
        >
          <img src="Фото/Уведомления.svg" />
          <h2>Победа на кубке по квантовому программированию</h2>
        </article>

        <article
          class="notification"
          onclick="window.location.href = 'article2.html'"
        >
          <img src="Фото/Уведомления.svg" />
          <h2>Открыта лаборатория цифровых двойников</h2>
        </article>

        <article
          class="notification"
          onclick="window.location.href = 'article5.html'"
        >
          <img src="Фото/Уведомления.svg" />
          <h2>День открытых дверей: «Твое будущее в IT»</h2>
        </article>
      </section>
    </main>
    <dialog class="logout-modal" id="logoutModal">
      <p>Вы точно хотите выйти?</p>
      <button class="logout-confirm" type="button">Выйти</button>
      <button class="logout-cancel" type="button">Отмена</button>
    </dialog>
    <script src="script/main.js"></script>
    <script src="script/responsive.js"></script>
  </body>
</html>
