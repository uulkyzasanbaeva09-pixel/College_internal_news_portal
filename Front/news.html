<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=`, initial-scale=1.0">
    <title>Новостной портал "ИТ.Москва"</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/news.css">
    <link rel="stylesheet" href="style/article.css">
</head>
<body>
    <aside class="sidebar">
        <img src="Фото/Лого.svg" alt="Логотип" />
        <h1 class="sidebar-h1"><span class="it">IT.</span>Москва</h1>
        <nav>
          <a class="nav-btn" href="index.html" aria-current="page">
            <img
              src="Фото/Дом.svg"
              alt="иконка главная"
              width="25"
              height="25"
            />
            Главная
          </a>
  
          <a class="nav-btn" href="favorites.html">
            <img
              src="Фото/Избранное.svg"
              alt="иконка избранное"
              width="30"
              height="30"
            />
            Избранное
          </a>
  
          <a class="nav-btn active" href="news.html">
            <img
              src="Фото/новости.svg"
              alt="иконка новости"
              width="30"
              height="30"
            />
            Все новости
          </a>
  
          <a class="nav-btn" href="settings.html">
            <img
              src="Фото/настройки.svg"
              alt="иконка настройки"
              width="30"
              height="30"
            />
            Настройки
          </a>
        </nav>
  
        <button class="exit" type="button">
          <img
            src="Фото/Выход.svg"
            alt="иконка выход"
            width="34"
            height="34"
          />
          Выйти
        </button>
      </aside>
      <header>
        <div class="header-left">
        <div class="search-container">
            <img src="Фото/Поиск.svg" alt="иконка поиска" class="search-icon">
            <input type="search" placeholder="Поиск новостей и мероприятий" class="search">
        </div>
        </div>
        <div class="header-right">
        <a href="notifications.html">
          <img
            src="Фото/Уведомления.svg"
            alt="иконка уведомления"
            class="bell"
          />
        </a>
        <a href="settings.html">
          <img
            src="Фото/Профиль.svg"
            alt="иконка профиль"
            class="profile"
          />
        </a>
        </div>
      </header>
      <dialog class="logout-modal" id="logoutModal">
        <p>Вы точно хотите выйти?</p>
        <button class="logout-confirm" type="button">Выйти</button>
        <button class="logout-cancel" type="button">Отмена</button>
      </dialog>
      <main>
        <h1 class="main-title">Все новости</h1>
        <section class="filters">
          <button class="filter-btn active" data-filter="all">Все</button>
          <button class="filter-btn" data-filter="учеба">Учеба</button>
          <button class="filter-btn" data-filter="мероприятия">Мероприятия</button>
          <button class="filter-btn" data-filter="конкурсы">Конкурсы</button>
          <button class="filter-btn" data-filter="спорт">Спорт</button>
        </section>
        
        <section class="cards">
        <article class="new" onclick="window.location.href='article5.html'" data-category="учеба">
          <img
            src="Фото/Последние новости_ 1.png"
            alt="Новость 1"
          />
          <h3>Победа на кубке по квантовому программированию</h3>
          <time datetime="2026-11-10">10.11.26г</time>
          <time datetime="18:00">18:00</time>
          <button class="heart" type="button" aria-label="Добавить в избранное">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 21s-8.5-5.3-10-9.5C.8 7.8 3.2 4.5 6.7 4.5c2 0 3.8 1.2 5.3 3 1.5-1.8 3.3-3 5.3-3 3.5 0 5.9 3.3 4.7 7C20.5 15.7 12 21 12 21z"
              />
            </svg>
          </button>
        </article>
        <article class="new" onclick="window.location.href='article6.html'" data-category="мероприятия">
          <img
            src="Фото/Последние новости_ 2.png"
            alt="Новость 2"
          />
          <h3>Открыта лаборатория цифровых двойников</h3>
          <time datetime="2026-11-11">11.11.26г</time>
          <time datetime="14:00">14:00</time>
          <button class="heart" type="button" aria-label="Добавить в избранное">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 21s-8.5-5.3-10-9.5C.8 7.8 3.2 4.5 6.7 4.5c2 0 3.8 1.2 5.3 3 1.5-1.8 3.3-3 5.3-3 3.5 0 5.9 3.3 4.7 7C20.5 15.7 12 21 12 21z"
              />
            </svg>
          </button>
        </article>
        <article class="new" onclick="window.location.href='article7.html'" data-category="спорт">
          <img
            src="Фото/Новость 3.png"
            alt="Новость 2"
          />
          <h3>Турнир по киберспорту среди колледжей</h3>
          <time datetime="2026-11-11">15.11.26г</time>
          <time datetime="14:00">16:00</time>
          <button class="heart" type="button" aria-label="Добавить в избранное">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 21s-8.5-5.3-10-9.5C.8 7.8 3.2 4.5 6.7 4.5c2 0 3.8 1.2 5.3 3 1.5-1.8 3.3-3 5.3-3 3.5 0 5.9 3.3 4.7 7C20.5 15.7 12 21 12 21z"
              />
            </svg>
          </button>
        </article>
      </section>
      </main>
      <script src="script/main.js"></script>
</body>
</html>
